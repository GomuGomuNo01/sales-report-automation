<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Report Automation : présentation vidéo</title>
  <meta name="description" content="Sales Report Automation en 40 secondes : des exports de ventes bruts au rapport de direction, automatiquement.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%232a78d6'/><stop offset='1' stop-color='%236d5bd0'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='url(%23g)'/><path d='M9 22v-4M14 22v-8M19 22v-6M24 22V10' stroke='white' stroke-width='2.6' stroke-linecap='round'/></svg>">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --line: rgba(11, 18, 32, 0.12);
      --text: #0b1220;
      --muted: #5a6678;
      --accent: #1f63b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 80% 0%, rgba(42, 120, 214, 0.16), transparent 50%),
        radial-gradient(circle at 10% 100%, rgba(109, 91, 208, 0.12), transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
    }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
    .logo { width: 44px; height: 44px; flex: none; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0; letter-spacing: -0.5px; }
    p.lead { color: var(--muted); margin: 0 0 28px; text-align: center; }
    .player {
      width: 100%; max-width: 1100px;
      border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
      background: #000; box-shadow: 0 30px 80px -30px rgba(16, 40, 90, 0.45);
    }
    video { display: block; width: 100%; height: auto; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 28px; }
    nav a {
      color: var(--text); text-decoration: none; padding: 12px 22px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface); font-weight: 600;
    }
    nav a.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    nav a:hover, nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <defs><linearGradient id="g-brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a78d6"/><stop offset="1" stop-color="#6d5bd0"/></linearGradient></defs>
      <rect width="32" height="32" rx="9" fill="url(#g-brand)"/>
      <path d="M9 22v-4M14 22v-8M19 22v-6M24 22V10" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <h1>Sales Report Automation en 40 secondes</h1>
  </header>
  <p class="lead">Des exports de ventes bruts au rapport de direction, automatiquement.</p>

  <div class="player">
    <video controls playsinline preload="metadata" poster="presentation-poster.jpg">
      <source src="SalesReport_presentation.mp4" type="video/mp4">
      Votre navigateur ne lit pas cette vidéo : <a href="SalesReport_presentation.mp4">la télécharger</a>.
    </video>
  </div>

  <nav>
    <a class="primary" href="https://sales-report-automation-cedric.streamlit.app">Essayer la démo en ligne</a>
  </nav>
</body>
</html>
