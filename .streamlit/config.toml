# Thème de la page de repli Streamlit (adresses inconnues), aligné sur les tokens du frontend
[theme]
primaryColor = "#1f63b8"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#f3f6fa"
textColor = "#0b1220"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
